		Graphene structure, 
		<br>
&nbsp;&nbsp;&nbsp; k points path: Gamma - M - K - Gamma  </font>

		<blockquote>
<div id="container-01" class="mol-container" style="width: 989px; height: 730px"></div>
<style>
.mol-container {
  width: 1000px;
  height:1000px;
  position: relative;
}
</style>
<script>
  let element = document.querySelector('#container-01');
  let config = { backgroundColor: '0xeeeeee' };
  let viewer = $3Dmol.createViewer( element, config );
//lattice 1-6
  viewer.addSphere({ center: {x: 0.000, y: 5.000, z: 0.000}, radius: 0.01, color: '0xaabbcc' });
  viewer.addLabel("1", {position: {x: 0.200, y: 5.600, z: 0.000}, backgroundColor: 0xeeeeee, backgroundOpacity: 0.1,fontColor: '0xeeeeef',fontSize: 12});
  	
  viewer.addSphere({ center: {x: 4.330, y: 2.500, z: 0.000},radius: 0.01, color: '0xaabbcc' });
  viewer.addLabel("2", {position: {x: 4.630, y: 2.800, z: 0.000}, backgroundColor: 0xeeeeee, backgroundOpacity: 0.1,fontColor: '0xeeeeef',fontSize: 12});
  	
  viewer.addSphere({ center: {x: 4.330, y:-2.500, z: 0.000},radius: 0.01, color: '0xaabbcc' });
  viewer.addLabel("3", {position: {x: 4.530, y:-2.700, z: 0.000}, backgroundColor: 0xeeeeee, backgroundOpacity: 0.1,fontColor: '0xeeeeef',fontSize: 12});	
   
  viewer.addSphere({ center: {x: 0.000, y:-5.000, z: 0.000},radius: 0.01, color: '0xaabbcc' });
  viewer.addLabel("4", {position: {x: 0.000, y:-5.000, z: 0.000}, backgroundColor: 0xeeeeee, backgroundOpacity: 0.1,fontColor: '0xeeeeef',fontSize: 12});	
  
  viewer.addSphere({ center: {x:-4.330, y:-2.500, z: 0.000},radius: 0.01, color: '0xaabbcc' });
  viewer.addLabel("5", {position: {x:-4.330, y:-2.500, z: 0.000}, backgroundColor: 0xeeeeee, backgroundOpacity: 0.1,fontColor: '0xeeeeef',fontSize: 12});	
  
  viewer.addSphere({ center: {x:-4.330, y: 2.500, z: 0.000},radius: 0.01, color: '0xaabbcc' });
  viewer.addLabel("6", {position: {x:-4.830, y: 2.900, z: 0.000}, backgroundColor: 0xeeeeee, backgroundOpacity: 0.1,fontColor: '0xeeeeef',fontSize: 12});

//bond  
   viewer.addCylinder({start:{x: 0.000, y: 5.000, z: 0.000},                          //bond 1-2
                              end:{x: 4.330, y: 2.500, z: 0.000},
                              radius:0.01,
                              color:'red',
                              fromCap:false,
                              toCap:false});
							  
  viewer.addCylinder({start:{x: 4.330, y: 2.500, z: 0.000},                           //bond 2-3
                              end:{x: 4.330, y:-2.500, z: 0.000},
                              radius:0.01,
                              color:'red',
                              fromCap:false,
                              toCap:false});
							  
  viewer.addCylinder({start:{x: 4.330, y:-2.500, z: 0.000},                           //bond 3-4
                              end:{x: 0.000, y:-5.000, z: 0.000},
                              radius:0.01,
                              color:'red',
                              fromCap:false,
                              toCap:false});
  	
  viewer.addCylinder({start:{x: 0.000, y:-5.000, z: 0.000},                           //bond 4-5
                              end:{x:-4.330, y:-2.500, z: 0.000},
                              radius:0.01,
                              color:'red',
                              fromCap:false,
                              toCap:false});
							  
  viewer.addCylinder({start:{x:-4.330, y:-2.500, z: 0.000},                           //bond 5-6
                              end:{x:-4.330, y: 2.500, z: 0.000},
                              radius:0.01,
                              color:'red',
                              fromCap:false,
                              toCap:false});
							  
  viewer.addCylinder({start:{x:-4.330, y: 2.500, z: 0.000},                           //bond 6-1
                              end:{x: 0.000, y: 5.000, z: 0.000},
                              radius:0.01,
                              color:'red',
                              fromCap:false,
                              toCap:false});				
  viewer.render();

//coordinates axis
    viewer.addLine({                                                   //i axis
                    start: {x: 0.000, y: 6.000, z: 0.000},
                    end: {x: 0.000, y:-6.000, z: 0.000},
                    color: 'green', dashed: true
                    });
    viewer.addLine({                                                   //j axis
                    start: {x:-6.000, y: 0.000, z: 0.000},
                    end: {x: 6.000, y: 0.000, z: 0.000},
                    color: 'green', dashed: true
                    });

 viewer.addLabel("b1", {position: {x:4.330, y:7.000, z: 0.000}, backgroundColor: 0xeeeeee, backgroundOpacity: 0.1,fontColor: 'red',fontSize: 20});
 viewer.addLabel("b2", {position: {x: 4.330, y:-7.000, z: 0.000}, backgroundColor: 0xeeeeee, backgroundOpacity: 0.1,fontColor: 'green',fontSize: 20});
 viewer.addLabel("b3", {position: {x:0.200, y:0.200, z:5.000}, backgroundColor: 0xeeeeee, backgroundOpacity: 0.1,fontColor: 'blue',fontSize: 20});

 viewer.addCylinder({start:{x: 0.000, y: 0.000, z: 0.000},
                              end:{x: 3.464, y: 6.000, z: 0.000},
                              radius:0.05,
                              color:'red',
                              fromCap:false,
                              toCap:false});      //b1-cylinder
 viewer.addArrow({
   start: {x: 3.464, y: 6.000, z: 0.000},
   end: {x: 4.330, y:7.500, z: 0.000},
   color: 'red',
   radius: 0.05,
    fromCap: 1,
    toCap: 1
 });                                               //b1-arrow

 viewer.addCylinder({start:{x: 0.000, y: 0.000, z: 0.000},
                              end:{x: 3.464, y: -6.000, z: 0.000},
                              radius:0.05,
                              color:'lightgreen',
                              fromCap:false,
                              toCap:false});      //b2-cylinder
 viewer.addArrow({
   start: {x: 3.464, y: -6.000, z: 0.000},
   end: {x: 4.330, y:-7.500, z: 0.000},
   color: 'lightgreen',
   radius: 0.05,
    fromCap: 1,
    toCap: 1
 });                                               //b2-arrow
 

 viewer.addCylinder({start:{x: 0.000, y: 0.000, z: 0.000},
                              end:{x: 0.000, y: 0.000, z: 4.000},
                              radius:0.05,
                              color:'blue',
                              fromCap:false,
                              toCap:false});      //b3-cylinder
   viewer.addArrow({
   start: {x: 0.000, y: 0.000, z: 4.000},
   end: {x: 0.000, y: 0.000, z: 6.000},
   color: 'blue',
   radius: 0.05,
    fromCap: 1,
    toCap: 1
 });                                               //b3-arrow
 viewer.render();
 
 //plane, Brillouin Zone
 function triangle(viewer) {
        var vertices = [];
 //       var normals = [];

        vertices.push(new $3Dmol.Vector3( 0.000, 5.000, 0.000));    //0
        vertices.push(new $3Dmol.Vector3( 4.330, 2.500, 0.000));    //1
        vertices.push(new $3Dmol.Vector3( 4.330,-2.500, 0.000));    //2
        vertices.push(new $3Dmol.Vector3( 0.000,-5.000, 0.000));    //3
        vertices.push(new $3Dmol.Vector3(-4.330,-2.500, 0.000));    //4
        vertices.push(new $3Dmol.Vector3(-4.330, 2.500, 0.000));    //5

        var faces1 = [ 0,1,2];  
        var faces2 = [ 0,2,3];
        var faces3 = [ 0,3,4]; 
        var faces4 = [ 0,4,5]; 

        var spec1 = {vertexArr:vertices, faceArr:faces1, color:'red', opacity: 0.5};
 		var spec2 = {vertexArr:vertices, faceArr:faces2, color:'red', opacity: 0.5};
        var spec3 = {vertexArr:vertices, faceArr:faces3, color:'red', opacity: 0.5};
 		var spec4 = {vertexArr:vertices, faceArr:faces4, color:'red', opacity: 0.5};

        viewer.addCustom(spec1);
 		viewer.addCustom(spec2);
        viewer.addCustom(spec3);
 		viewer.addCustom(spec4);	
     }
    triangle(viewer);
//      viewer.zoomTo();
  viewer.render();
  
//k-points
  viewer.addSphere({ center: {x: 0.000, y: 0.000, z: 0.000},radius: 0.04, color: '0xaabbcc' });     //Gamma
  viewer.addLabel("Gamma", {position: {x:-0.300, y:-0.200, z: 0.000}, backgroundColor: 0xeeeeee, backgroundOpacity: 0.1,fontColor: 'red',fontSize: 24});
  viewer.addSphere({ center: {x: 4.330, y: 0.000, z: 0.000},radius: 0.04, color: '0xaabbcc' });     //M
  viewer.addLabel("M", {position: {x: 4.330, y: 0.000, z: 0.000}, backgroundColor: 0xeeeeee, backgroundOpacity: 0.1,fontColor: 'red',fontSize: 20});
  viewer.addSphere({ center: {x: 4.330, y: 2.500, z: 0.000},radius: 0.04, color: '0xaabbcc' });     //K
  viewer.addLabel("K", {position: {x: 4.330, y: 2.500, z: 0.000}, backgroundColor: 0xeeeeee, backgroundOpacity: 0.1,fontColor: 'red',fontSize: 20});
  viewer.addSphere({ center: {x: 4.330, y:-2.500, z: 0.000},radius: 0.04, color: '0xaabbcc' });     //K
  viewer.addLabel("K'", {position: {x: 4.330, y:-2.500, z: 0.000}, backgroundColor: 0xeeeeee, backgroundOpacity: 0.1,fontColor: 'red',fontSize: 20});
  
//k-path
  viewer.addCylinder({start:{x: 0.000, y: 0.000, z: 0.000},                           //gamma  --> M
                              end:{x: 4.330, y: 0.000, z: 0.000},
                              radius:0.02,
                              color:'red',
                              fromCap:false,
                              toCap:false});
  viewer.addCylinder({start:{x: 4.330, y: 0.000, z: 0.000},                           //M      --> K
                              end:{x: 4.330, y: 2.500, z: 0.000},
                              radius:0.02,
                              color:'red',
                              fromCap:false,
                              toCap:false});  
  viewer.addCylinder({start:{x: 4.330, y: 2.500, z: 0.000},                           //K      --> gamma
                              end:{x: 0.000, y: 0.000, z: 0.000},
                              radius:0.02,
                              color:'red',
                              fromCap:false,
                              toCap:false}); 
							  
viewer.addLabel("1st BZ of graphene", {position: {x: 5.0, y: -5.0, z: 0.0}, backgroundColor: 0x800080, backgroundOpacity: 0.8});							  							  
  viewer.render();
  viewer.zoom(0.8, 1000);
</script>
